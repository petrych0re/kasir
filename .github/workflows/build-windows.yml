name: Build Windows Portable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - name: Build portable app
        run: pyinstaller --noconfirm --clean --windowed --onedir --name KasirSembako kasir_sembako.py
      - name: Package
        run: Compress-Archive -Path dist\KasirSembako\* -DestinationPath KasirSembako-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KasirSembako-Windows-Portable
          path: KasirSembako-Windows-Portable.zip
          retention-days: 14
